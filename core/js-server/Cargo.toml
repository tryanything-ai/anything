[package]
name = "js-executor"
version = "0.1.0"
edition = "2021"

[dependencies]
# gRPC with blocking runtime
tonic = "0.10"
prost = "0.12"

# Deno core for JavaScript execution
deno_core = "0.234"

# Serialization and JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_v8 = "0.234"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1.0", features = ["v4"] }
anyhow = "1.0"

# Threading and synchronization
crossbeam = "0.8"
parking_lot = "0.12"

# HTTP server for gRPC (using hyper directly instead of tokio)
hyper = { version = "0.14", features = ["server", "http1", "http2", "tcp"] }
tower = "0.4"

# Minimal tokio ONLY for tonic compatibility
tokio = { version = "1.38", features = ["rt", "net", "time"] }

[dev-dependencies]

[build-dependencies]
tonic-build = "0.10" 