syntax = "proto3";

package js_executor;

service JsExecutor {
  rpc ExecuteJavaScript(ExecuteRequest) returns (ExecuteResponse);
  rpc HealthCheck(HealthRequest) returns (HealthResponse);
}

message ExecuteRequest {
  string code = 1;
  string inputs_json = 2;  // JSON string of inputs
  uint64 timeout_ms = 3;
  string execution_id = 4; // For tracking/logging
}

message ExecuteResponse {
  bool success = 1;
  string result_json = 2;  // JSON string of result
  string error_message = 3;
  string error_type = 4;
  string error_stack = 5;
  uint64 execution_time_ms = 6;
  string execution_id = 7;
}

message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
  string version = 2;
  uint64 uptime_ms = 3;
  uint32 active_executions = 4;
} 